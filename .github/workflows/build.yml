name: Build

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Link to the PvZ2 Reflourished 1.4.2 APK (direct, Google Drive or MEGA)"
        required: true
      obb_url:
        description: "Link to the OBB (leave empty: the mod's own 1.4.2 OBB is used)"
        required: false
        default: ""
      platforms:
        description: "What to build"
        type: choice
        options: [iPhone/iPad and Mac, iPhone/iPad, Mac]
        default: iPhone/iPad and Mac
      variants:
        description: "Which downloads to build"
        type: choice
        options: [Slim and full, Slim, Full]
        default: Slim and full
      release_tag:
        description: "Release tag (leave empty: v<VERSION>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Android /usr/local/share/dotnet || true
          df -h /

      - name: MEGA support
        if: contains(github.event.inputs.apk_url, 'mega.') || contains(github.event.inputs.obb_url, 'mega.')
        run: brew install megatools

      - name: Newest Xcode
        run: |
          x="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$x"
          xcodebuild -version

      - name: Release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          . scripts/app-version.sh
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "game=$GAME_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG:-v$APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "prefix=PvZ2-Reflourished-$GAME_VERSION-Darwin-$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          APK_URL: ${{ github.event.inputs.apk_url }}
          OBB_URL: ${{ github.event.inputs.obb_url }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
          VARIANTS: ${{ github.event.inputs.variants }}
        run: |
          set -euo pipefail
          case "$PLATFORMS" in
            "iPhone/iPad") platforms=(--ios) ;;
            "Mac") platforms=(--mac) ;;
            *) platforms=(--ios --mac) ;;
          esac
          case "$VARIANTS" in
            "Slim") variants=(slim) ;;
            "Full") variants=(full) ;;
            *) variants=(slim full) ;;
          esac
          reuse=()
          for variant in "${variants[@]}"; do
            extra=()
            [ "$variant" = slim ] && extra+=(--slim)
            [ -n "$OBB_URL" ] && extra+=(--obb "$OBB_URL")
            ./build.sh "${platforms[@]}" ${extra[@]+"${extra[@]}"} ${reuse[@]+"${reuse[@]}"} --apk "$APK_URL" --out out
            scripts/package-release.sh out release "$variant"
            # Keep downloaded inputs and converted dylibs, not bundles or converter scratch files.
            rm -rf out/.work/ios out/.work/macos 'out/PvZ2 Reflourished.app' out/.work/libs \
              out/.work/ios-dylibs/.work out/.work/macos-dylibs/.work
            reuse=(--reuse-converted)
            df -h /
          done
          ls -lh release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: "Reflourished-Darwin ${{ steps.metadata.outputs.version }} · PvZ2: Reflourished ${{ steps.metadata.outputs.game }}"
          body: |
            Reflourished-Darwin ${{ steps.metadata.outputs.version }} · PvZ2: Reflourished ${{ steps.metadata.outputs.game }}
            This release contains the platforms and variants selected for this build.

            **Slim:** a small download. The app downloads the game's data on first launch.
            - iPhone / iPad: `${{ steps.metadata.outputs.prefix }}-iOS.ipa`
            - Mac: `${{ steps.metadata.outputs.prefix }}-Mac.dmg`

            **Full:** the game's data is inside. Pick this for an offline first launch.
            - iPhone / iPad: `${{ steps.metadata.outputs.prefix }}-iOS-Full.ipa`
            - Mac: `${{ steps.metadata.outputs.prefix }}-Mac-Full.dmg`

            **iPhone / iPad:** install the IPA with SideStore, AltStore, Sideloadly or LiveContainer.
            **Mac:** open the DMG and drag the app onto Applications. The first time, macOS refuses to open it (it is not notarized): click Done, then Open Anyway in System Settings > Privacy & Security. After that the Mac app updates itself (PvZ2 Reflourished > Check for Updates…).
          files: release/*
          fail_on_unmatched_files: true

      - name: Update the AltStore source
        if: github.event.inputs.platforms != 'Mac' && github.event.inputs.variants != 'Full'
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          GAME: ${{ steps.metadata.outputs.game }}
          PREFIX: ${{ steps.metadata.outputs.prefix }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/update-altstore-source.py "release/$PREFIX-iOS.ipa" --tag "$TAG" \
            --icon-url "https://github.com/$REPOSITORY/releases/download/$TAG/PvZ2-Reflourished-icon.png" \
            --changelog "Reflourished-Darwin $VERSION · PvZ2: Reflourished $GAME."
          python3 scripts/update-altstore-source.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(altstore): update the source for $TAG"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Update the Mac update feed
        if: github.event.inputs.platforms != 'iPhone/iPad' && github.event.inputs.variants != 'Full'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.metadata.outputs.tag }}
          PREFIX: ${{ steps.metadata.outputs.prefix }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "no SPARKLE_PRIVATE_KEY secret: the Mac update feed is left as it is"
            exit 0
          fi
          # Every update is the slim app, signed with the key whose public half the app carries.
          dmg="release/$PREFIX-Mac.dmg"
          sig="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | out/.work/sparkle/bin/sign_update --ed-key-file - -p "$dmg")"
          python3 scripts/update-appcast.py "$dmg" --tag "$TAG" --ed-signature "$sig"
          python3 scripts/update-appcast.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sparkle/appcast.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore(sparkle): update the Mac update feed for $TAG"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
