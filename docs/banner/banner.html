<!doctype html>
<html><head><meta charset="utf-8"><title>Reflourished banner</title>
<!-- The repository's banner, 1280x640 (render.sh draws it at 2x). Options in the URL:
     bg=night|day|nebula  the lawn art behind it (bg-*.webp), or a gradient in the icon's colours
     blur=<px>            how much the lawn art is blurred (default 4)
     at=corner|center     the title in the top left corner, or centred above the windows
     mac=<image>  phone=<image>   other screenshots (mac: a window capture with its title bar,
                          2200x1076; phone: an iPhone 18 Pro simulator shot with the island) -->
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; background: #140a2a; }
  .stage { position: relative; width: 1280px; height: 640px; overflow: hidden; }

  /* nebula: the icon's colours */
  .nebula { position: absolute; inset: 0;
    background:
      radial-gradient(60% 70% at 18% 30%, rgba(146, 64, 196, .55), transparent 70%),
      radial-gradient(50% 60% at 85% 80%, rgba(32, 150, 160, .50), transparent 70%),
      radial-gradient(45% 55% at 70% 10%, rgba(214, 72, 168, .30), transparent 70%),
      radial-gradient(40% 50% at 30% 95%, rgba(40, 110, 170, .35), transparent 70%),
      linear-gradient(160deg, #1d0d3d 0%, #160a30 50%, #0d1a2e 100%); }
  .nebula::before { content: ""; position: absolute; inset: -40px;
    background:
      radial-gradient(18% 22% at 12% 70%, rgba(120, 220, 230, .18), transparent 70%),
      radial-gradient(22% 18% at 55% 20%, rgba(190, 120, 230, .20), transparent 70%),
      radial-gradient(16% 20% at 92% 35%, rgba(120, 220, 230, .14), transparent 70%);
    filter: blur(20px); }
  .spark { position: absolute; width: 24px; height: 24px; transform: translate(-50%, -50%);
    background:
      linear-gradient(90deg, transparent 0 46%, #fff 46% 54%, transparent 54%),
      linear-gradient(0deg, transparent 0 46%, #fff 46% 54%, transparent 54%);
    -webkit-mask: radial-gradient(circle, #000 0 18%, rgba(0,0,0,.6) 30%, transparent 70%);
    filter: drop-shadow(0 0 6px rgba(255, 150, 240, .9)); opacity: .85; }
  .dot { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px 1px rgba(255, 180, 255, .8); opacity: .7; }

  /* a picture background (the lawn art), blurred a little and slightly enlarged so the
     blur has no soft edges */
  .photo { position: absolute; inset: 0; background-size: cover; background-position: center;
    transform: scale(1.06); }
  .shade { position: absolute; inset: 0;
    background: radial-gradient(75% 85% at 50% 55%, transparent 40%, rgba(0,0,0,.35) 100%); }

  .win { position: absolute; filter: drop-shadow(0 30px 40px rgba(0,0,0,.55)) drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
  .win img { display: block; width: 100%; }

  /* the Mac window: the capture's own title bar, with the traffic lights drawn lit */
  .mac img { border-radius: 0 0 7px 7px; }
  .mac .lights span { position: absolute; width: calc(28 / 2200 * 100%); aspect-ratio: 1; border-radius: 50%;
    top: calc((31.75 - 14) / 1076 * 100%); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
  .mac .lights span:nth-child(1) { left: calc((31.75 - 14) / 2200 * 100%); background: #ff5f57; }
  .mac .lights span:nth-child(2) { left: calc((78 - 14) / 2200 * 100%); background: #febc2e; }
  .mac .lights span:nth-child(3) { left: calc((124 - 14) / 2200 * 100%); background: #28c840; }

  /* the screen keeps an iPhone's shape (19.5:9, like the screenshot), the frame grows around
     it; the island and the round corners are in the screenshot itself */
  .phone { position: absolute; border-radius: 40px; padding: 6px; box-sizing: border-box;
    background: linear-gradient(135deg, #5b5862, #2b2930 40%, #4a4750 60%, #1d1c21);
    box-shadow: 0 30px 50px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.4), inset 0 0 0 1.5px rgba(255,255,255,.12); }
  .phone .bezel { position: relative; width: 100%; border-radius: 34px; background: #000; padding: 4px; box-sizing: border-box; }
  .phone .screen { position: relative; width: 100%; aspect-ratio: 2000 / 920; border-radius: 30px; overflow: hidden; }
  .phone .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .icon { position: absolute; transform: rotate(-9deg); container-type: size;
    box-shadow: 0 30px 50px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.35); }
  .icon img { width: 100%; height: 100%; display: block; border-radius: inherit; }
  .icon::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  /* an Apple logo (U+F8FF, which only Apple's system font draws as the logo: render on a Mac)
     on a round badge over the icon's bottom left corner; sized from the icon (cqw) */
  .icon .apple { position: absolute; z-index: 1; display: flex; align-items: center; justify-content: center;
    left: -7%; bottom: -7%; width: 34%; height: 34%; border-radius: 50%; color: #fff;
    font: 400 23cqw/1 -apple-system, "SF Pro Text", system-ui, sans-serif;
    background: rgba(18, 12, 30, .78); backdrop-filter: blur(10px);
    box-shadow: 0 8px 18px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(255,255,255,.22); }
  .icon .apple span { margin-top: -6%; }

  /* the title: the PvZ2 logo's lettering over Reflourished's */
  .headline { position: absolute; color: #fff;
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    text-shadow: 0 2px 14px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5); }
  .headline img { display: block; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
  .headline .pvz { margin-bottom: 6px; }
  .headline p { margin: 10px 0 0 2px; font-size: 21px; font-weight: 600; line-height: 1.2; opacity: .92; }

  /* the repository, bottom left */
  .repo { position: absolute; left: 46px; bottom: 30px; display: flex; align-items: center; gap: 10px;
    padding: 9px 18px 9px 14px; border-radius: 999px; color: #fff;
    font: 600 20px/1 -apple-system, "SF Pro Text", system-ui, sans-serif; letter-spacing: .2px;
    background: rgba(10, 6, 20, .45); backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.14); }
  .repo svg { width: 24px; height: 24px; fill: currentColor; }

  /* corner: the title top left, the windows to the right of it, the icon below it */
  .at-corner .headline { left: 46px; top: 34px; }
  .at-corner .headline img { width: 370px; }
  .at-corner .settings { left: 700px; top: 30px; width: 410px; }
  .at-corner .mac { left: 296px; top: 178px; width: 680px; }
  .at-corner .phone { left: 872px; top: 368px; width: 380px; }
  .at-corner .icon { left: 40px; top: 226px; width: 292px; height: 292px; border-radius: 65px; }

  /* center: the title centred above, Settings beside it, the Mac window right of the GitHub line */
  .at-center .headline { left: 0; right: 0; top: 24px; text-align: center; }
  .at-center .headline img { width: 410px; margin-left: auto; margin-right: auto; }
  .at-center .headline p { margin-left: 0; }
  .at-center .settings { left: 866px; top: 30px; width: 384px; }
  .at-center .mac { left: 440px; top: 214px; width: 690px; }
  .at-center .phone { left: 868px; top: 412px; width: 384px; }
  .at-center .icon { left: 64px; top: 238px; width: 284px; height: 284px; border-radius: 63px; }
  .at-center .repo { bottom: 16px; }
</style></head>
<body><div class="stage" id="stage">
  <div class="nebula" id="nebula">
    <i class="spark" style="left:96px;top:86px"></i>
    <i class="spark" style="left:420px;top:70px;transform:translate(-50%,-50%) scale(.7)"></i>
    <i class="spark" style="left:1210px;top:120px;transform:translate(-50%,-50%) scale(.8)"></i>
    <i class="spark" style="left:205px;top:560px;transform:translate(-50%,-50%) scale(.6)"></i>
    <i class="spark" style="left:640px;top:600px;transform:translate(-50%,-50%) scale(.75)"></i>
    <i class="dot" style="left:300px;top:120px"></i>
    <i class="dot" style="left:560px;top:40px"></i>
    <i class="dot" style="left:40px;top:330px"></i>
    <i class="dot" style="left:1150px;top:300px"></i>
    <i class="dot" style="left:780px;top:580px"></i>
    <i class="dot" style="left:1240px;top:600px"></i>
    <i class="dot" style="left:360px;top:610px"></i>
  </div>
  <div class="photo" id="photo" hidden></div>
  <div class="shade" id="shade" hidden></div>

  <div class="headline">
    <img class="pvz" src="pvz2-word.png" alt="">
    <img class="word" src="logo-word.png" alt="">
    <p>on iPhone, iPad and Mac</p>
  </div>

  <div class="win settings"><img src="settings.png"></div>
  <div class="win mac"><img src="mac.png"><div class="lights"><span></span><span></span><span></span></div></div>
  <div class="phone"><div class="bezel"><div class="screen"><img src="phone.jpg"></div></div></div>
  <div class="icon"><img src="icon.png"><div class="apple" aria-hidden="true"><span>&#xF8FF;</span></div></div>
  <div class="repo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.06-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>oenderg/Reflourished-Darwin</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const stage = document.getElementById('stage');
  const bg = q.get('bg') || 'night';
  if (bg !== 'nebula') {
    document.getElementById('nebula').hidden = true;
    const photo = document.getElementById('photo');
    photo.hidden = false;
    photo.style.backgroundImage = `url(bg-${bg}.webp)`;
    photo.style.filter = `blur(${q.get('blur') ?? 4}px)`;
    document.getElementById('shade').hidden = false;
  }
  stage.classList.add('at-' + (q.get('at') || 'corner'));
  if (q.get('mac')) document.querySelector('.mac img').src = q.get('mac');
  if (q.get('phone')) document.querySelector('.phone img').src = q.get('phone');
</script>
</body></html>
